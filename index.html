<script>

/* =====================================================
   ELEMENTS
===================================================== */

const $ =
  id => document.getElementById(id);


const canvas =
  $("game");


const ctx =
  canvas.getContext(
    "2d",
    {
      alpha:false
    }
  );


ctx.imageSmoothingEnabled =
  true;


ctx.imageSmoothingQuality =
  "high";


const durationInput =
  $("duration");


const durationLabel =
  $("durationLabel");


const spawnRateInput =
  $("spawnRate");


const hookInput =
  $("hook");


const finalTextInput =
  $("finalText");


const gravityInput =
  $("gravity");


const restitutionInput =
  $("restitution");


const dampingInput =
  $("damping");


const volumeInput =
  $("volume");


const volumeLabel =
  $("volumeLabel");


const statusEl =
  $("status");


const startButton =
  $("startButton");


const resetButton =
  $("resetButton");


const recordButton =
  $("recordButton");


/* =====================================================
   ARENA
===================================================== */

const arena = {

  cx:288,

  cy:512,

  r:246,

  left:250,

  right:326,

  joinY:269,

  line:5.5

};


/* =====================================================
   LEVELS
===================================================== */

const LEVEL_COUNT =
  8;


const radii = [

  19,
  24,
  29,
  36,
  44,
  50,
  57,
  66

];


const fallbackEmoji = [

  "",
  "🍓",
  "🍋",
  "🍇",
  "🍑",
  "🍐",
  "🍎",
  "🍍"

];


const glowColors = [

  "#1476ff",
  "#ff3355",
  "#ffe347",
  "#a84cff",
  "#ff7040",
  "#b7ef50",
  "#ff3340",
  "#ffb229"

];


const levelImages =
  Array(
    LEVEL_COUNT
  ).fill(null);


const levelWrap =
  $("levels");


for(
  let level = 0;
  level < LEVEL_COUNT;
  level++
){

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "level";


  element.innerHTML =
    `

      <div
        class="preview"
        id="preview-${level}"
      >

        ${
          level === 0
          ?
          "🔵"
          :
          fallbackEmoji[level]
        }

      </div>

      <b>
        LEVEL ${level + 1}
      </b>

      <input
        type="file"
        accept="image/png,image/jpeg,image/webp"
      >

    `;


  levelWrap.appendChild(
    element
  );


  element
    .querySelector("input")
    .addEventListener(
      "change",
      event => {

        const file =
          event.target.files[0];


        if(!file){
          return;
        }


        const image =
          new Image();


        image.onload =
          () => {

            levelImages[level] =
              image;


            const preview =
              $(
                `preview-${level}`
              );


            preview.textContent =
              "";


            preview.style.backgroundImage =
              `url("${image.src}")`;

          };


        image.src =
          URL.createObjectURL(
            file
          );

      }
    );

}


/* =====================================================
   STATE
===================================================== */

let balls =
  [];


let effects =
  [];


let running =
  false;


let animationFrame =
  null;


let startTime =
  0;


let lastTime =
  0;


let spawnClock =
  0;


let accumulator =
  0;


let finalReachedAt =
  null;


const STEP =
  1 / 120;


const MAX_STEPS =
  6;


const MAX_BALLS =
  58;


/* =====================================================
   BALL
===================================================== */

function makeBall(
  level,
  x = arena.cx,
  y = -25,
  vx = 0,
  vy = 172
){

  return {

    level,

    x,

    y,

    vx,

    vy,

    r:
      radii[level],

    age:
      0,

    mass:
      radii[level]
      *
      radii[level],

    squash:
      0,

    stretch:
      0,

    pop:
      0,

    glowBoost:
      0

  };

}


function spawnBall(){

  if(
    balls.length
    >=
    MAX_BALLS
  ){
    return;
  }


  balls.push(
    makeBall(0)
  );

}


/* =====================================================
   AUDIO
===================================================== */

let audioContext =
  null;


let masterGain =
  null;


let compressor =
  null;


let audioDestination =
  null;


const mergeNotes = [

  329.63,
  440.00,
  587.33,
  783.99,
  1046.50,
  1318.51,
  1760.00

];


function ensureAudio(){

  if(audioContext){

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

    return;

  }


  audioContext =
    new(
      window.AudioContext
      ||
      window.webkitAudioContext
    )();


  masterGain =
    audioContext.createGain();


  compressor =
    audioContext
      .createDynamicsCompressor();


  audioDestination =
    audioContext
      .createMediaStreamDestination();


  compressor.threshold.value =
    -18;


  compressor.knee.value =
    10;


  compressor.ratio.value =
    3;


  compressor.attack.value =
    0.002;


  compressor.release.value =
    0.12;


  masterGain.connect(
    compressor
  );


  compressor.connect(
    audioContext.destination
  );


  compressor.connect(
    audioDestination
  );


  updateVolume();

}


function updateVolume(){

  volumeLabel.textContent =
    volumeInput.value
    +
    "%";


  if(masterGain){

    masterGain.gain.value =
      Number(
        volumeInput.value
      )
      /
      100;

  }

}


volumeInput.addEventListener(
  "input",
  updateVolume
);


/* =====================================================
   MERGE SOUND
===================================================== */

function playMergeSound(
  newLevel,
  x
){

  if(
    !audioContext
    ||
    newLevel < 1
  ){
    return;
  }


  const index =
    Math.min(
      newLevel - 1,
      mergeNotes.length - 1
    );


  const frequency =
    mergeNotes[index];


  const now =
    audioContext.currentTime;


  const pan =
    audioContext
      .createStereoPanner();


  pan.pan.value =
    Math.max(
      -0.45,
      Math.min(
        0.45,
        (
          x - 288
        )
        /
        288
      )
    );


  pan.connect(
    masterGain
  );


  /* MAIN CHIME */

  const osc =
    audioContext
      .createOscillator();


  const gain =
    audioContext
      .createGain();


  osc.type =
    "sine";


  osc.frequency.setValueAtTime(
    frequency * 1.035,
    now
  );


  osc.frequency
    .exponentialRampToValueAtTime(
      frequency,
      now + 0.055
    );


  gain.gain.setValueAtTime(
    0.0001,
    now
  );


  gain.gain
    .exponentialRampToValueAtTime(
      0.13,
      now + 0.003
    );


  gain.gain
    .exponentialRampToValueAtTime(
      0.0001,
      now + 0.28
    );


  osc.connect(
    gain
  );


  gain.connect(
    pan
  );


  osc.start(now);


  osc.stop(
    now + 0.3
  );


  /* HIGH SPARKLE */

  const sparkle =
    audioContext
      .createOscillator();


  const sparkleGain =
    audioContext
      .createGain();


  sparkle.type =
    "sine";


  sparkle.frequency.value =
    frequency * 4;


  sparkleGain.gain
    .setValueAtTime(
      0.0001,
      now
    );


  sparkleGain.gain
    .exponentialRampToValueAtTime(
      0.018,
      now + 0.002
    );


  sparkleGain.gain
    .exponentialRampToValueAtTime(
      0.0001,
      now + 0.15
    );


  sparkle.connect(
    sparkleGain
  );


  sparkleGain.connect(
    pan
  );


  sparkle.start(now);


  sparkle.stop(
    now + 0.17
  );


  /* SOFT BODY FOR BIG FRUITS */

  if(
    index >= 3
  ){

    const low =
      audioContext
        .createOscillator();


    const lowGain =
      audioContext
        .createGain();


    low.type =
      "sine";


    low.frequency.value =
      95
      +
      index * 7;


    lowGain.gain
      .setValueAtTime(
        0.0001,
        now
      );


    lowGain.gain
      .exponentialRampToValueAtTime(
        0.022,
        now + 0.003
      );


    lowGain.gain
      .exponentialRampToValueAtTime(
        0.0001,
        now + 0.095
      );


    low.connect(
      lowGain
    );


    lowGain.connect(
      pan
    );


    low.start(now);


    low.stop(
      now + 0.11
    );

  }

}


/* =====================================================
   MERGE VISUAL
===================================================== */

function addMergeEffect(
  x,
  y,
  level
){

  const sparks =
    [];


  for(
    let i = 0;
    i < 10;
    i++
  ){

    sparks.push({

      angle:
        Math.random()
        *
        Math.PI
        *
        2,

      speed:
        18
        +
        Math.random()
        *
        34,

      size:
        1
        +
        Math.random()
        *
        1.7

    });

  }


  effects.push({

    x,

    y,

    level,

    age:
      0,

    life:
      0.38,

    sparks

  });


  if(
    effects.length > 20
  ){

    effects.shift();

  }

}


/* =====================================================
   ARENA COLLISION
===================================================== */

function nearOpening(
  ball
){

  return (

    ball.y
    <
    arena.joinY
    +
    ball.r
    +
    5

    &&

    ball.x
    >
    arena.left
    -
    ball.r * 0.15

    &&

    ball.x
    <
    arena.right
    +
    ball.r * 0.15

  );

}


function solveArena(
  ball,
  restitution,
  damping
){

  /* ENTRY CHUTE */

  if(
    ball.y
    -
    ball.r
    <
    arena.joinY + 2
  ){

    if(
      ball.x
      -
      ball.r
      <
      arena.left
    ){

      ball.x =
        arena.left
        +
        ball.r;


      if(ball.vx < 0){

        ball.vx =
          -ball.vx
          *
          0.06;

      }

    }


    if(
      ball.x
      +
      ball.r
      >
      arena.right
    ){

      ball.x =
        arena.right
        -
        ball.r;


      if(ball.vx > 0){

        ball.vx =
          -ball.vx
          *
          0.06;

      }

    }

  }


  const dx =
    ball.x
    -
    arena.cx;


  const dy =
    ball.y
    -
    arena.cy;


  const distance =
    Math.hypot(
      dx,
      dy
    )
    ||
    1;


  if(
    distance
    +
    ball.r
    >
    arena.r
    &&
    !nearOpening(ball)
  ){

    const nx =
      dx
      /
      distance;


    const ny =
      dy
      /
      distance;


    ball.x =
      arena.cx
      +
      nx
      *
      (
        arena.r
        -
        ball.r
      );


    ball.y =
      arena.cy
      +
      ny
      *
      (
        arena.r
        -
        ball.r
      );


    const normalVelocity =
      ball.vx
      *
      nx
      +
      ball.vy
      *
      ny;


    if(
      normalVelocity > 0
    ){

      /* VISUAL SQUASH */

      const impactStrength =
        Math.min(
          1,
          Math.abs(
            normalVelocity
          )
          /
          500
        );


      ball.squash =
        Math.max(
          ball.squash,
          impactStrength * 0.065
        );


      ball.glowBoost =
        Math.max(
          ball.glowBoost,
          impactStrength * 0.22
        );


      /* PHYSICS - LITTLE REAL BOUNCE */

      ball.vx -=
        (
          1
          +
          restitution
        )
        *
        normalVelocity
        *
        nx;


      ball.vy -=
        (
          1
          +
          restitution
        )
        *
        normalVelocity
        *
        ny;


      const tangentX =
        -ny;


      const tangentY =
        nx;


      const tangentVelocity =
        ball.vx
        *
        tangentX
        +
        ball.vy
        *
        tangentY;


      ball.vx -=
        tangentVelocity
        *
        tangentX
        *
        (
          1
          -
          damping
        );


      ball.vy -=
        tangentVelocity
        *
        tangentY
        *
        (
          1
          -
          damping
        );


      /* SETTLE SOFTLY */

      if(
        Math.abs(ball.vy) < 9
        &&
        ny > 0.65
      ){

        ball.vy =
          0;

      }

    }

  }

}


/* =====================================================
   SPATIAL GRID
===================================================== */

function getPairs(){

  const cellSize =
    82;


  const grid =
    new Map();


  for(
    let i = 0;
    i < balls.length;
    i++
  ){

    const ball =
      balls[i];


    const x =
      Math.floor(
        ball.x / cellSize
      );


    const y =
      Math.floor(
        ball.y / cellSize
      );


    const key =
      x + "," + y;


    if(
      !grid.has(key)
    ){

      grid.set(
        key,
        []
      );

    }


    grid
      .get(key)
      .push(i);

  }


  const pairs =
    [];


  const seen =
    new Set();


  for(
    const [
      key,
      ids
    ]
    of grid
  ){

    const [
      gridX,
      gridY
    ] =
      key
        .split(",")
        .map(Number);


    for(
      let offsetX = -1;
      offsetX <= 1;
      offsetX++
    ){

      for(
        let offsetY = -1;
        offsetY <= 1;
        offsetY++
      ){

        const other =
          grid.get(
            (
              gridX + offsetX
            )
            +
            ","
            +
            (
              gridY + offsetY
            )
          );


        if(!other){
          continue;
        }


        for(
          const i
          of ids
        ){

          for(
            const j
            of other
          ){

            if(i >= j){
              continue;
            }


            const pairKey =
              i + ":" + j;


            if(
              seen.has(pairKey)
            ){
              continue;
            }


            seen.add(
              pairKey
            );


            pairs.push(
              [
                i,
                j
              ]
            );

          }

        }

      }

    }

  }


  return pairs;

}


/* =====================================================
   PHYSICS
===================================================== */

function physicsStep(
  dt
){

  const gravity =
    Number(
      gravityInput.value
    );


  const restitution =
    Number(
      restitutionInput.value
    );


  const damping =
    Number(
      dampingInput.value
    );


  for(
    const ball
    of balls
  ){

    ball.age +=
      dt;


    /* VISUAL ANIMATION DECAY */

    ball.squash *=
      Math.pow(
        0.80,
        dt * 60
      );


    ball.stretch *=
      Math.pow(
        0.80,
        dt * 60
      );


    ball.pop *=
      Math.pow(
        0.76,
        dt * 60
      );


    ball.glowBoost *=
      Math.pow(
        0.78,
        dt * 60
      );


    /* ENTRY SPEED */

    if(
      ball.y
      <
      arena.joinY + 6
    ){

      ball.vy +=
        gravity
        *
        0.18
        *
        dt;

    }

    else{

      ball.vy +=
        gravity
        *
        dt;

    }


    ball.vx *=
      Math.pow(
        damping,
        dt * 60
      );


    ball.vy *=
      Math.pow(
        0.9992,
        dt * 60
      );


    ball.x +=
      ball.vx
      *
      dt;


    ball.y +=
      ball.vy
      *
      dt;


    solveArena(
      ball,
      restitution,
      damping
    );

  }


  const pairs =
    getPairs();


  /* SMALL MERGE ASSIST */

  for(
    const [
      i,
      j
    ]
    of pairs
  ){

    const a =
      balls[i];


    const b =
      balls[j];


    if(
      !a
      ||
      !b
      ||
      a.level !== b.level
      ||
      a.y < arena.joinY
      ||
      b.y < arena.joinY
    ){
      continue;
    }


    const dx =
      b.x - a.x;


    const dy =
      b.y - a.y;


    const distance =
      Math.hypot(
        dx,
        dy
      )
      ||
      1;


    const reach =
      (
        a.r + b.r
      )
      *
      1.55;


    if(
      distance < reach
      &&
      distance
      >
      a.r + b.r
    ){

      const force =
        (
          1
          -
          distance / reach
        )
        *
        8;


      a.vx +=
        dx
        /
        distance
        *
        force
        *
        dt;


      a.vy +=
        dy
        /
        distance
        *
        force
        *
        dt;


      b.vx -=
        dx
        /
        distance
        *
        force
        *
        dt;


      b.vy -=
        dy
        /
        distance
        *
        force
        *
        dt;

    }

  }


  const removed =
    new Set();


  const created =
    [];


  for(
    const [
      i,
      j
    ]
    of pairs
  ){

    const a =
      balls[i];


    const b =
      balls[j];


    if(
      !a
      ||
      !b
      ||
      removed.has(a)
      ||
      removed.has(b)
    ){
      continue;
    }


    const dx =
      b.x - a.x;


    const dy =
      b.y - a.y;


    const distance =
      Math.hypot(
        dx,
        dy
      )
      ||
      0.001;


    const minDistance =
      a.r
      +
      b.r;


    if(
      distance
      >=
      minDistance
    ){
      continue;
    }


    const nx =
      dx / distance;


    const ny =
      dy / distance;


    const overlap =
      minDistance
      -
      distance;


    /* =================================================
       MERGE
    ================================================= */

    if(

      a.level === b.level

      &&

      a.level
      <
      LEVEL_COUNT - 1

      &&

      a.age > 0.08

      &&

      b.age > 0.08

      &&

      a.y
      >
      arena.joinY - 5

      &&

      b.y
      >
      arena.joinY - 5

    ){

      const newLevel =
        a.level + 1;


      const totalMass =
        a.mass + b.mass;


      const x =
        (
          a.x * a.mass
          +
          b.x * b.mass
        )
        /
        totalMass;


      const y =
        (
          a.y * a.mass
          +
          b.y * b.mass
        )
        /
        totalMass;


      const vx =
        (
          a.vx * a.mass
          +
          b.vx * b.mass
        )
        /
        totalMass;


      /* NO STRONG PHYSICAL POP */

      const vy =
        (
          a.vy * a.mass
          +
          b.vy * b.mass
        )
        /
        totalMass
        -
        7;


      removed.add(a);


      removed.add(b);


      const newBall =
        makeBall(
          newLevel,
          x,
          y,
          vx,
          vy
        );


      /* SATISFYING VISUAL POP */

      newBall.pop =
        0.145;


      newBall.glowBoost =
        0.60;


      newBall.stretch =
        0.025;


      created.push(
        newBall
      );


      addMergeEffect(
        x,
        y,
        newLevel
      );


      playMergeSound(
        newLevel,
        x
      );


      if(
        newLevel === 7
        &&
        finalReachedAt === null
      ){

        finalReachedAt =
          performance.now();

      }


      continue;

    }


    /* =================================================
       NORMAL FRUIT COLLISION
    ================================================= */

    const invMassA =
      1 / a.mass;


    const invMassB =
      1 / b.mass;


    const totalInverseMass =
      invMassA
      +
      invMassB;


    a.x -=
      nx
      *
      overlap
      *
      (
        invMassA
        /
        totalInverseMass
      );


    a.y -=
      ny
      *
      overlap
      *
      (
        invMassA
        /
        totalInverseMass
      );


    b.x +=
      nx
      *
      overlap
      *
      (
        invMassB
        /
        totalInverseMass
      );


    b.y +=
      ny
      *
      overlap
      *
      (
        invMassB
        /
        totalInverseMass
      );


    const relativeX =
      b.vx - a.vx;


    const relativeY =
      b.vy - a.vy;


    const normalVelocity =
      relativeX * nx
      +
      relativeY * ny;


    if(
      normalVelocity < 0
    ){

      const collisionRestitution =
        0.055;


      const impulse =
        -
        (
          1
          +
          collisionRestitution
        )
        *
        normalVelocity
        /
        totalInverseMass;


      const impulseX =
        impulse * nx;


      const impulseY =
        impulse * ny;


      a.vx -=
        impulseX
        *
        invMassA;


      a.vy -=
        impulseY
        *
        invMassA;


      b.vx +=
        impulseX
        *
        invMassB;


      b.vy +=
        impulseY
        *
        invMassB;


      /* VISUAL SQUISH FROM COLLISION */

      const impact =
        Math.min(
          1,
          Math.abs(
            normalVelocity
          )
          /
          350
        );


      const squashAmount =
        impact * 0.035;


      a.squash =
        Math.max(
          a.squash,
          squashAmount
        );


      b.squash =
        Math.max(
          b.squash,
          squashAmount
        );


      a.glowBoost =
        Math.max(
          a.glowBoost,
          impact * 0.12
        );


      b.glowBoost =
        Math.max(
          b.glowBoost,
          impact * 0.12
        );


      /* FRICTION */

      const tangentX =
        -ny;


      const tangentY =
        nx;


      const tangentVelocity =
        relativeX * tangentX
        +
        relativeY * tangentY;


      const friction =
        0.14;


      const tangentImpulse =
        Math.max(

          -Math.abs(
            impulse
          )
          *
          friction,

          Math.min(

            Math.abs(
              impulse
            )
            *
            friction,

            -
            tangentVelocity
            /
            totalInverseMass

          )

        );


      a.vx -=
        tangentImpulse
        *
        tangentX
        *
        invMassA;


      a.vy -=
        tangentImpulse
        *
        tangentY
        *
        invMassA;


      b.vx +=
        tangentImpulse
        *
        tangentX
        *
        invMassB;


      b.vy +=
        tangentImpulse
        *
        tangentY
        *
        invMassB;

    }

  }


  balls =
    balls.filter(
      ball =>
        !removed.has(ball)
    );


  balls.push(
    ...created
  );


  if(
    balls.length > MAX_BALLS
  ){

    balls.splice(
      0,
      balls.length - MAX_BALLS
    );

  }


  for(
    const effect
    of effects
  ){

    effect.age +=
      dt;

  }


  effects =
    effects.filter(
      effect =>
        effect.age
        <
        effect.life
    );

}


/* =====================================================
   DRAW ARENA
===================================================== */

function drawArena(){

  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    576,
    1024
  );


  const half =
    (
      arena.right
      -
      arena.left
    )
    /
    2;


  const angle =
    Math.asin(
      half / arena.r
    );


  ctx.save();


  ctx.lineCap =
    "round";


  ctx.lineJoin =
    "round";


  /* SOFT GLOW */

  ctx.strokeStyle =
    "rgba(110,190,255,.28)";


  ctx.shadowColor =
    "#4f9eff";


  ctx.shadowBlur =
    16;


  ctx.lineWidth =
    arena.line + 4;


  ctx.beginPath();


  ctx.arc(
    arena.cx,
    arena.cy,
    arena.r,
    -Math.PI / 2 + angle,
    Math.PI * 1.5 - angle
  );


  ctx.stroke();


  ctx.beginPath();


  ctx.moveTo(
    arena.left,
    -10
  );


  ctx.lineTo(
    arena.left,
    arena.joinY
  );


  ctx.moveTo(
    arena.right,
    -10
  );


  ctx.lineTo(
    arena.right,
    arena.joinY
  );


  ctx.stroke();


  /* CLEAN WHITE CORE */

  ctx.shadowColor =
    "#ffffff";


  ctx.shadowBlur =
    4;


  ctx.strokeStyle =
    "#ffffff";


  ctx.lineWidth =
    arena.line;


  ctx.beginPath();


  ctx.arc(
    arena.cx,
    arena.cy,
    arena.r,
    -Math.PI / 2 + angle,
    Math.PI * 1.5 - angle
  );


  ctx.stroke();


  ctx.beginPath();


  ctx.moveTo(
    arena.left,
    -10
  );


  ctx.lineTo(
    arena.left,
    arena.joinY
  );


  ctx.moveTo(
    arena.right,
    -10
  );


  ctx.lineTo(
    arena.right,
    arena.joinY
  );


  ctx.stroke();


  ctx.restore();

}


/* =====================================================
   BLUE ORB
===================================================== */

function drawOrb(
  ball
){

  const r =
    ball.r;


  const squash =
    ball.squash || 0;


  const pop =
    ball.pop || 0;


  const stretch =
    ball.stretch || 0;


  const scaleX =
    1
    +
    squash
    +
    pop
    -
    stretch * 0.4;


  const scaleY =
    1
    -
    squash * 0.68
    +
    pop
    +
    stretch;


  ctx.save();


  ctx.translate(
    ball.x,
    ball.y
  );


  ctx.scale(
    scaleX,
    scaleY
  );


  ctx.shadowColor =
    "#106fff";


  ctx.shadowBlur =
    13
    +
    ball.glowBoost * 22;


  const gradient =
    ctx.createRadialGradient(

      -r * 0.30,
      -r * 0.32,
      r * 0.05,

      0,
      0,
      r

    );


  gradient.addColorStop(
    0,
    "#e8fbff"
  );


  gradient.addColorStop(
    0.12,
    "#55d9ff"
  );


  gradient.addColorStop(
    0.37,
    "#0871ff"
  );


  gradient.addColorStop(
    0.69,
    "#002caa"
  );


  gradient.addColorStop(
    1,
    "#00082b"
  );


  ctx.beginPath();


  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    gradient;


  ctx.fill();


  ctx.shadowBlur =
    0;


  ctx.strokeStyle =
    "rgba(100,190,255,.85)";


  ctx.lineWidth =
    1.4;


  ctx.stroke();


  /* SUBTLE ELECTRIC DETAILS */

  ctx.globalAlpha =
    0.68;


  ctx.strokeStyle =
    "#c0f4ff";


  ctx.lineWidth =
    0.7;


  for(
    let i = 0;
    i < 3;
    i++
  ){

    const angle =
      ball.age * 1.2
      +
      i * 2.05;


    ctx.beginPath();


    ctx.arc(

      Math.cos(angle)
      *
      r
      *
      0.08,

      Math.sin(angle)
      *
      r
      *
      0.08,

      r
      *
      (
        0.31
        +
        i * 0.07
      ),

      angle,

      angle + 0.72

    );


    ctx.stroke();

  }


  ctx.restore();

}


/* =====================================================
   DRAW FRUIT
===================================================== */

function drawSprite(
  ball
){

  const image =
    levelImages[
      ball.level
    ];


  if(
    ball.level === 0
    &&
    !image
  ){

    drawOrb(
      ball
    );


    return;

  }


  const squash =
    ball.squash || 0;


  const pop =
    ball.pop || 0;


  const stretch =
    ball.stretch || 0;


  /*
    SQUASH & STRETCH:
    visually bouncy without
    actually bouncing far.
  */

  const scaleX =
    1
    +
    squash
    +
    pop
    -
    stretch * 0.4;


  const scaleY =
    1
    -
    squash * 0.70
    +
    pop
    +
    stretch;


  ctx.save();


  ctx.translate(
    ball.x,
    ball.y
  );


  ctx.scale(
    scaleX,
    scaleY
  );


  ctx.shadowColor =
    glowColors[
      ball.level
    ];


  ctx.shadowBlur =
    11
    +
    ball.level * 0.7
    +
    ball.glowBoost * 25;


  if(image){

    const target =
      ball.r * 2.35;


    const scale =
      Math.min(

        target / image.width,

        target / image.height

      );


    const width =
      image.width
      *
      scale;


    const height =
      image.height
      *
      scale;


    ctx.drawImage(

      image,

      -width / 2,

      -height / 2,

      width,

      height

    );

  }

  else{

    ctx.font =
      `${
        Math.round(
          ball.r * 2.05
        )
      }px Apple Color Emoji,Segoe UI Emoji,sans-serif`;


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.fillText(

      fallbackEmoji[
        ball.level
      ],

      0,

      2

    );

  }


  ctx.restore();

}


/* =====================================================
   MERGE EFFECTS
===================================================== */

function drawEffects(){

  for(
    const effect
    of effects
  ){

    const progress =
      effect.age
      /
      effect.life;


    const alpha =
      1 - progress;


    const radius =
      radii[
        effect.level
      ]
      *
      (
        1
        +
        progress * 0.95
      );


    ctx.save();


    ctx.globalAlpha =
      alpha * 0.75;


    ctx.strokeStyle =
      glowColors[
        effect.level
      ];


    ctx.shadowColor =
      glowColors[
        effect.level
      ];


    ctx.shadowBlur =
      18;


    ctx.lineWidth =
      2.2
      *
      (
        1 - progress
      )
      +
      0.45;


    ctx.beginPath();


    ctx.arc(
      effect.x,
      effect.y,
      radius,
      0,
      Math.PI * 2
    );


    ctx.stroke();


    /* SECOND SOFT RING */

    ctx.globalAlpha =
      alpha * 0.25;


    ctx.beginPath();


    ctx.arc(
      effect.x,
      effect.y,
      radius * 1.22,
      0,
      Math.PI * 2
    );


    ctx.stroke();


    ctx.globalAlpha =
      alpha * 0.72;


    ctx.fillStyle =
      glowColors[
        effect.level
      ];


    for(
      const spark
      of effect.sparks
    ){

      const distance =
        spark.speed
        *
        progress;


      const x =
        effect.x
        +
        Math.cos(
          spark.angle
        )
        *
        distance;


      const y =
        effect.y
        +
        Math.sin(
          spark.angle
        )
        *
        distance;


      ctx.beginPath();


      ctx.arc(
        x,
        y,
        spark.size
        *
        (
          1
          -
          progress * 0.5
        ),
        0,
        Math.PI * 2
      );


      ctx.fill();

    }


    ctx.restore();

  }

}


/* =====================================================
   TEXT
===================================================== */

function drawText(
  elapsed
){

  const hook =
    hookInput.value.trim();


  if(
    hook
    &&
    elapsed < 4.6
  ){

    const fadeIn =
      Math.min(
        1,
        elapsed / 0.35
      );


    const fadeOut =
      Math.min(
        1,
        (
          4.6 - elapsed
        )
        /
        0.45
      );


    ctx.save();


    ctx.globalAlpha =
      Math.min(
        fadeIn,
        fadeOut
      );


    ctx.font =
      "700 29px ui-monospace,SFMono-Regular,Menlo,monospace";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.fillStyle =
      "#fff";


    ctx.shadowColor =
      "#90c8ff";


    ctx.shadowBlur =
      8;


    ctx.fillText(
      hook,
      288,
      350
    );


    ctx.restore();

  }


  const finalText =
    finalTextInput
      .value
      .trim();


  if(
    finalReachedAt !== null
    &&
    finalText
  ){

    ctx.save();


    ctx.font =
      "800 29px ui-monospace,SFMono-Regular,Menlo,monospace";


    ctx.textAlign =
      "center";


    ctx.fillStyle =
      "#fff";


    ctx.shadowColor =
      "#8ec6ff";


    ctx.shadowBlur =
      8;


    ctx.fillText(
      finalText,
      288,
      367
    );


    ctx.restore();

  }

}


/* =====================================================
   DRAW
===================================================== */

function draw(
  elapsed = 0
){

  drawArena();


  for(
    const ball
    of balls
  ){

    drawSprite(
      ball
    );

  }


  drawEffects();


  drawText(
    elapsed
  );

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

  cancelAnimationFrame(
    animationFrame
  );


  running =
    false;


  balls =
    [];


  effects =
    [];


  accumulator =
    0;


  spawnClock =
    0;


  finalReachedAt =
    null;


  draw(0);


  statusEl.textContent =
    "Bereit.";

}


/* =====================================================
   START
===================================================== */

function startGame(){

  ensureAudio();


  cancelAnimationFrame(
    animationFrame
  );


  balls =
    [];


  effects =
    [];


  accumulator =
    0;


  spawnClock =
    0;


  finalReachedAt =
    null;


  running =
    true;


  startTime =
    performance.now();


  lastTime =
    startTime;


  spawnBall();


  statusEl.textContent =
    "Spiel läuft…";


  animationFrame =
    requestAnimationFrame(
      gameLoop
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(
  now
){

  if(!running){
    return;
  }


  const delta =
    Math.min(

      0.05,

      (
        now
        -
        lastTime
      )
      /
      1000

    );


  lastTime =
    now;


  accumulator +=
    delta;


  spawnClock +=
    delta;


  const spawnInterval =
    Number(
      spawnRateInput.value
    );


  while(
    spawnClock
    >=
    spawnInterval
  ){

    spawnClock -=
      spawnInterval;


    spawnBall();

  }


  let steps =
    0;


  while(
    accumulator >= STEP
    &&
    steps < MAX_STEPS
  ){

    physicsStep(
      STEP
    );


    accumulator -=
      STEP;


    steps++;

  }


  if(
    steps === MAX_STEPS
  ){

    accumulator =
      0;

  }


  const elapsed =
    (
      now - startTime
    )
    /
    1000;


  draw(
    elapsed
  );


  const maxDuration =
    Number(
      durationInput.value
    );


  if(

    (
      finalReachedAt !== null
      &&
      now - finalReachedAt > 3200
    )

    ||

    elapsed >= maxDuration

  ){

    running =
      false;


    statusEl.textContent =
      finalReachedAt !== null
      ?
      "Final-Level erreicht."
      :
      "Maximale Laufzeit erreicht.";


    if(recording){

      setTimeout(
        stopRecording,
        180
      );

    }


    return;

  }


  animationFrame =
    requestAnimationFrame(
      gameLoop
    );

}


/* =====================================================
   RECORDING
===================================================== */

let recorder =
  null;


let recordedChunks =
  [];


let recording =
  false;


function startRecording(){

  ensureAudio();


  if(recording){

    stopRecording();

    return;

  }


  if(
    !canvas.captureStream
    ||
    typeof MediaRecorder ===
    "undefined"
  ){

    statusEl.textContent =
      "Aufnahme wird hier nicht unterstützt. Nutze Chrome am MacBook.";


    return;

  }


  const videoStream =
    canvas.captureStream(
      30
    );


  const tracks =
    [
      ...videoStream
        .getVideoTracks()
    ];


  if(audioDestination){

    tracks.push(
      ...audioDestination
        .stream
        .getAudioTracks()
    );

  }


  const stream =
    new MediaStream(
      tracks
    );


  let mimeType =
    "video/webm;codecs=vp9,opus";


  if(
    MediaRecorder
      .isTypeSupported(
        "video/mp4"
      )
  ){

    mimeType =
      "video/mp4";

  }

  else if(
    !MediaRecorder
      .isTypeSupported(
        mimeType
      )
  ){

    mimeType =
      "video/webm";

  }


  try{

    recorder =
      new MediaRecorder(

        stream,

        {

          mimeType,

          videoBitsPerSecond:
            6500000,

          audioBitsPerSecond:
            160000

        }

      );

  }

  catch{

    recorder =
      new MediaRecorder(
        stream
      );

  }


  recordedChunks =
    [];


  recorder.ondataavailable =
    event => {

      if(event.data.size){

        recordedChunks.push(
          event.data
        );

      }

    };


  recorder.onstop =
    () => {

      const type =
        recorder.mimeType
        ||
        "video/webm";


      const blob =
        new Blob(

          recordedChunks,

          {
            type
          }

        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =
        "bounce-lab-"
        +
        Date.now()
        +
        (
          type.includes("mp4")
          ?
          ".mp4"
          :
          ".webm"
        );


      link.click();


      setTimeout(
        () =>
          URL.revokeObjectURL(url),
        2000
      );


      statusEl.textContent =
        "Video mit Sound gespeichert.";

    };


  recorder.start(
    1000
  );


  recording =
    true;


  recordButton.textContent =
    "■ Aufnahme stoppen";


  recordButton.classList.add(
    "danger"
  );


  statusEl.textContent =
    "Aufnahme läuft. Jetzt Spiel starten.";

}


function stopRecording(){

  if(
    recorder
    &&
    recorder.state !==
    "inactive"
  ){

    recorder.stop();

  }


  recording =
    false;


  recordButton.textContent =
    "● Aufnahme starten";


  recordButton.classList.remove(
    "danger"
  );

}


/* =====================================================
   EVENTS
===================================================== */

startButton.addEventListener(
  "click",
  startGame
);


resetButton.addEventListener(
  "click",
  resetGame
);


recordButton.addEventListener(
  "click",
  startRecording
);


durationInput.addEventListener(
  "input",
  () => {

    durationLabel.textContent =
      durationInput.value
      +
      " s";

  }
);


resetGame();

</script>

</body>
</html>
